server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache largo para assets con hash; el index siempre fresco.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA: cualquier ruta desconocida sirve index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
